<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css">
    <title>frontend</title>
  </head>
  <body>
    <div class ="form-container">
        <form id="reserve-form" class="reserve-form" action="submit">
          <label for="input-name">Nombre:</label>
          <input type="text" id="input-name" required>
          <label for="input-date">Fecha: </label>
          <input type="date" id="input-date" required>
          <label for="input-time">Horario: </label>
          <input type="time" id="input-time" required>
          <label for="input-size">Cantidad de personas: </label>
          <input type="number" id="input-size" required>
          <button id="reserve-btn">Reservar</button>
        </form>
    </div>
    <div class="pago-container oculto">
      <p>Para confirmar la reserva confirme la seña.</p>
      <button class="pago-btn">Pagar</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
