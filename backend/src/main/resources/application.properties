# URL de conexión (mem indica que es en memoria RAM)
spring.datasource.url=jdbc:h2:mem:viringos_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Le decimos a Hibernate que hable en dialecto H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crea y actualiza las tablas automáticamente leyendo tus @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Esto es VITAL: obliga a Spring a crear las tablas de tus @Entity ANTES de ejecutar el SQL
spring.jpa.defer-datasource-initialization=true

# ¡Magia pura! Habilita una interfaz web para ver tu base de datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console